[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scrollrank"
version = "0.1.0"
description = "CPU-first ink prospecting tools for the Vesuvius Challenge (First Letters search)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-image>=0.21",
  "tifffile>=2023.1",
  "pillow>=9.0",
  "imagecodecs>=2023.1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
scrollrank = "scrollrank.cli:main"

[tool.setuptools.packages.find]
include = ["scrollrank*"]
